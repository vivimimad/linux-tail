name: Linux SSH Server (Tailscale)

# Sadece elle başlatılır (Actions > Run workflow). Otomatik çalışma yok.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: 1. Kullanıcıyı ve SSH'ı kur (sadece anahtar ile giriş)
        env:
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: |
          set -e
          if [ -z "$SSH_PUBKEY" ]; then
            echo "HATA: SSH_PUBKEY secret'ı tanımlı değil."; exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y openssh-server

          # Kullanıcı (şifresiz, sadece anahtar ile girilecek)
          sudo useradd -m -s /bin/bash cynetadmin || true
          sudo passwd -l cynetadmin
          sudo usermod -aG sudo cynetadmin
          echo "cynetadmin ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/cynetadmin
          sudo chmod 440 /etc/sudoers.d/cynetadmin

          # Public key
          sudo mkdir -p /home/cynetadmin/.ssh
          echo "$SSH_PUBKEY" | sudo tee /home/cynetadmin/.ssh/authorized_keys > /dev/null
          sudo chown -R cynetadmin:cynetadmin /home/cynetadmin/.ssh
          sudo chmod 700 /home/cynetadmin/.ssh
          sudo chmod 600 /home/cynetadmin/.ssh/authorized_keys

          # sshd ayarı: 00- öneki ile diğer dosyalardan önce okunur (ilk eşleşen kazanır)
          sudo tee /etc/ssh/sshd_config.d/00-hardening.conf > /dev/null <<'EOF'
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
          AllowUsers cynetadmin
          EOF
          sudo mkdir -p /run/sshd
          sudo sshd -t
          sudo systemctl restart ssh

      - name: 2. Kalıcı klasörü hazırla
        run: |
          sudo mkdir -p /home/cynetadmin/workspace
          # Cache işlemi runner kullanıcısıyla çalışır, geçici olarak ona ver
          sudo chown -R runner:runner /home/cynetadmin/workspace

      - name: 3. Kalıcı klasörü geri yükle
        uses: actions/cache@v4
        with:
          path: /home/cynetadmin/workspace
          key: ssh-workspace-${{ github.run_id }}
          restore-keys: |
            ssh-workspace-

      - name: 4. Klasör sahipliğini cynetadmin'e ver
        run: |
          sudo chown -R cynetadmin:cynetadmin /home/cynetadmin/workspace
          # Job sonunda cache kaydı için okunabilir olsun
          sudo chmod -R a+rX /home/cynetadmin/workspace

      - name: 5. Tailscale bağlantısı
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="cynet-linux-ssh"
          TS_IP=$(tailscale ip -4)
          echo "=============================================="
          echo " SSH sunucusu hazır"
          echo " Bağlanmak için: ssh cynetadmin@$TS_IP"
          echo " Kalıcı klasör : /home/cynetadmin/workspace"
          echo "=============================================="

      - name: 6. Sunucuyu açık tut (5s 40dk)
        run: |
          for i in $(seq 1 340); do
            sleep 60
            echo "[$i/340] SSH sunucusu aktif..."
          done

      # Cache kaydı, job bitince actions/cache'in post-step'i ile otomatik yapılır.
      # Ayrı bir "save" adımına gerek yok.
